<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Metric Paper - PlaygroundI">
        <title>Metric Paper</title>
        <link rel="stylesheet" href="game1.css">
        <script src="game1.js" defer></script>
    </head>
    <body>
        <div class="centerHorizontally">
            <img src="../assets/logo.png" alt="PlaygroundI Logo" width="400" id="logoPNG">
        </div>
        <div id="title">
            <h1 class="title">Metric Paper</h1>
        </div>
        <div id="imgPaper" class="centerHorizontally">
            <img src="A4.jpeg" alt="Paper" width="400" height="500" id="paper">
        </div>
        <div id="infoPaper" class="centerHorizontally">
            <p id="infoPaper">21.0 x 29.7 cm, 
                <br>
                The standard paper. Used for school, printers, and documents.
            </p>
        </div>
        <div id="foldunfold" class="centerHorizontally">
            <button id="fold">Fold</button>
            <button id="unfold">Unfold</button>
        </div>
        <audio id="foldSound" src="Paper Fold.wav"></audio>
    </body>
</html>
